apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: target-app
  labels:
    app: frontend
spec:
  # Served by Traefik (helm-values/traefik-values.yaml); host port 8080 -> k3d LB -> Traefik :80.
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
