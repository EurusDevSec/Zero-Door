# network-policies.yaml — Network Security Foundation
# ====================================================
# Cấu hình NetworkPolicy để bảo vệ namespace monitoring
# Lưu ý: Cần CNI hỗ trợ NetworkPolicy (như Calico). Flannel mặc định của K3s
# sẽ bỏ qua các rules này, nhưng cấu hình vẫn cần thiết cho đúng chuẩn Production.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fluent-bit-to-elasticsearch
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: elasticsearch
  policyTypes:
    - Ingress
  ingress:
    # 1. Cho phép Fluent Bit trong namespace monitoring đẩy logs
    - from:
        - podSelector:
            matchLabels:
              app: fluent-bit
      ports:
        - protocol: TCP
          port: 9200
    # 2. Cho phép Gaia Agent trong namespace zero-door query Elasticsearch (Phase 2)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zero-door
      ports:
        - protocol: TCP
          port: 9200
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scraping-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Egress
  egress:
    # Cho phép Prometheus Egress hoàn toàn tự do đến mọi đích (CoreDNS, API Server, Kubelet và các Pods metrics)
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
  ingress:
    # Cho phép truy cập Grafana UI từ bên ngoài (thông qua Ingress hoặc port-forward)
    - ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 80
