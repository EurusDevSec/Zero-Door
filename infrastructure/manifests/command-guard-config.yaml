# Render-only template. Disabled, neutral sample IDs; not an approved run context.
# Apply/provisioning/secrets/runtime require a separate authorized operation.
# The optional "sqli" block is the opt-in ZER-42 executor capability, shipped disabled; its endpoint goes
# through the Traefik ingress (never straight to the fixture ClusterIP, which would lose the source-IP point).
# An approved SQLi lab run uses infrastructure/manifests/sqli-executor-lab.yaml, not this default config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zd-command-policy
  namespace: zero-door
data:
  policy.json: |
    {
      "version": "zd-guard/1",
      "enabled": false,
      "context": {
        "run_id": "run_00000000000000000000000000000000",
        "trial_id": "trl_00000000000000000000000000000000",
        "group": "B0"
      },
      "targets": [
        {
          "namespace": "target-app",
          "service": "frontend",
          "url": "http://frontend.target-app.svc.cluster.local/"
        },
        {
          "namespace": "target-app",
          "service": "cartservice",
          "url": ""
        },
        {
          "namespace": "target-app",
          "service": "productcatalogservice",
          "url": ""
        },
        {
          "namespace": "target-app",
          "service": "currencyservice",
          "url": ""
        },
        {
          "namespace": "target-app",
          "service": "checkoutservice",
          "url": ""
        },
        {
          "namespace": "target-app",
          "service": "redis-cart",
          "url": ""
        },
        {
          "namespace": "target-app",
          "service": "shippingservice",
          "url": ""
        },
        {
          "namespace": "target-app",
          "service": "paymentservice",
          "url": ""
        },
        {
          "namespace": "target-app",
          "service": "emailservice",
          "url": ""
        }
      ],
      "maxDurationSec": 60,
      "maxConcurrency": 2,
      "rps": 5,
      "sqli": {
        "enabled": false,
        "endpoint": "http://zer41-private-ingress.zd-sqli-lab.svc.cluster.local:8000/fixture/catalog/search",
        "maxSends": 20,
        "maxCommandSec": 30
      }
    }
