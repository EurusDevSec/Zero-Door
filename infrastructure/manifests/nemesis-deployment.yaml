---
# ConfigMap — non-sensitive Nemesis configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: nemesis-config
  namespace: zero-door
  labels:
    app: nemesis
    phase: "3"
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka.zero-door.svc.cluster.local:9092"
  KAFKA_COMMANDS_TOPIC: "attack.commands"
  KAFKA_RESULTS_TOPIC: "attack.results"
  KAFKA_GROUP_ID: "nemesis-group"
  PROMETHEUS_URL: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
  NEMESIS_LLM_PROVIDER: "gemini"          # Use gemini with round-robin keys
  OLLAMA_BASE_URL: "http://ollama.zero-door.svc.cluster.local:11434/v1"
  OLLAMA_MODEL: "llama3"
  OPENAI_MODEL: "gpt-4o-mini"
  GEMINI_MODEL: "gemini-3.1-flash-lite"   # Gemini target model
  HEPHAESTUS_URL: "http://hephaestus.zero-door.svc.cluster.local:8000"
  MAX_ATTACK_DURATION_SEC: "60"

---
# Secret — stores the OpenAI and Gemini API keys (base64-encoded)
# Replace the placeholder value with: echo -n "key1,key2" | base64
apiVersion: v1
kind: Secret
metadata:
  name: nemesis-secrets
  namespace: zero-door
  labels:
    app: nemesis
    phase: "3"
type: Opaque
data:
  OPENAI_API_KEY: ""   # <-- base64-encoded key.
  GEMINI_API_KEYS: ""  # <-- base64-encoded keys (comma-separated, e.g. key1,key2)

---
# Deployment — Nemesis agent
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemesis
  namespace: zero-door
  labels:
    app: nemesis
    phase: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nemesis
  template:
    metadata:
      labels:
        app: nemesis
        phase: "3"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: nemesis
          image: nemesis:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: nemesis-config
            - secretRef:
                name: nemesis-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # uvicorn writes tmp files
            capabilities:
              drop: ["ALL"]
      restartPolicy: Always

---
# Service — exposes Nemesis REST API within the cluster
apiVersion: v1
kind: Service
metadata:
  name: nemesis
  namespace: zero-door
  labels:
    app: nemesis
    phase: "3"
spec:
  selector:
    app: nemesis
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP

---
# Ingress — expose Nemesis API on host port 8080/nemesis/
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nemesis-ingress
  namespace: zero-door
  labels:
    app: nemesis
    phase: "3"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /nemesis(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: nemesis
                port:
                  number: 8000
