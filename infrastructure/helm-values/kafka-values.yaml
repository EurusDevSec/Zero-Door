# Bitnami Kafka Helm Values — LEAN LOCAL (16GB RAM laptop)
# ========================================================
# Tối ưu tối đa: KRaft combined mode (1 pod duy nhất thay vì 2)
# Tổng RAM Kafka: ~600-800MB thay vì 1.5GB
#
# Cài/cập nhật từ gốc repo qua renderer JMX bắt buộc:
#   bash infrastructure/scripts/setup-phase1.sh --component kafka

# ---- Global Image Overrides ----
# Sử dụng repository legacy do chính sách phân phối mới của Bitnami (từ tháng 6/2026)
image:
  registry: docker.io
  repository: bitnamilegacy/kafka
  tag: 3.8.0-debian-12-r7

# ---- KRaft Combined Mode ----
# Controller + Broker gộp vào 1 process duy nhất
# → Chỉ 1 pod Kafka thay vì 2 pods riêng biệt
kraft:
  enabled: true

controller:
  replicaCount: 1
  # Template 29.3.2 dùng coalesce(controller.heapOpts, heapOpts); default chart là 1024m > limit.
  # Chừa ~384Mi cho metaspace, thread stack, direct buffer và page cache trong limit 768Mi.
  heapOpts: "-Xmx384m -Xms384m"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "768Mi"       # Gộp controller+broker nên cần hơn chút
  persistence:
    enabled: true
    size: 2Gi
    storageClass: "local-path"

# Tắt broker riêng (dùng combined mode)
broker:
  replicaCount: 0            # 0 = dùng controller làm broker luôn

# ---- Listeners ----
listeners:
  client:
    protocol: PLAINTEXT
  interbroker:
    protocol: PLAINTEXT
  controller:
    protocol: PLAINTEXT

# ---- 5 Topics tự động tạo ----
# Job chạy theo hook post-install/post-upgrade; preset micro (256Mi request) cộng đủ agent
# vượt requests.memory 1Gi của namespace, nên khai báo resource tường minh cho init và Job.
provisioning:
  enabled: true
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "384Mi"
  topics:
    - name: attack.commands
      partitions: 1
      replicationFactor: 1
      config:
        retention.ms: "86400000"

    - name: attack.results
      partitions: 1
      replicationFactor: 1
      config:
        retention.ms: "86400000"

    - name: monitoring.alerts
      partitions: 1
      replicationFactor: 1
      config:
        retention.ms: "86400000"

    - name: healing.actions
      partitions: 1
      replicationFactor: 1
      config:
        retention.ms: "86400000"

    - name: system.logs
      partitions: 1
      replicationFactor: 1
      config:
        retention.ms: "172800000"

# ---- Metrics ----
metrics:
  jmx:
    enabled: true
    image:
      registry: docker.io
      repository: bitnamilegacy/jmx-exporter
      tag: 1.0.1-debian-12-r2
    # Kafka 29.3.2 hard-codes MaxRAMPercentage=100. The repository postrenderer
    # sets -Xms32m -Xmx128m inside this unchanged 256Mi limit.
    # Use setup-phase1.sh (zd_kafka_renderer), not a bare Helm upgrade.
    # Preset micro (250m/256Mi) không cần cho một exporter local; khai báo để admission có căn cứ.
    resources:
      requests:
        cpu: "25m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
  # Chart 29.3.2 hardcodes path "/" in its ServiceMonitor; jmx-exporter 1.x serves an HTML page there
  # and Prometheus 3 rejects text/html. The equivalent ServiceMonitor below scrapes /metrics instead.
  serviceMonitor:
    enabled: false

extraDeploy:
  - apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: kafka-jmx-metrics
      namespace: monitoring
      labels:
        app.kubernetes.io/instance: kafka
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: metrics
    spec:
      selector:
        matchLabels:
          app.kubernetes.io/instance: kafka
          app.kubernetes.io/name: kafka
          app.kubernetes.io/component: metrics
      namespaceSelector:
        matchNames:
          - zero-door
      endpoints:
        - port: http-metrics
          path: /metrics

# ---- Zookeeper tắt ----
zookeeper:
  enabled: false

# ---- Single Broker Optimization ----
extraConfig: |
  offsets.topic.replication.factor=1
  transaction.state.log.replication.factor=1
  transaction.state.log.min.isr=1
  default.replication.factor=1
