# ResourceQuota cho namespace monitoring
# ==========================================
# Prometheus + Grafana + Elasticsearch + Fluent Bit
# Prometheus scraping + TSDB storage khá nặng (~1-2GB RAM)
# Elasticsearch single-node cần ~1GB RAM tối thiểu
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: monitoring-quota
  namespace: monitoring
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "6Gi"
    limits.cpu: "10"
    limits.memory: "10Gi"
    pods: "15"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: monitoring-limits
  namespace: monitoring
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "3"
        memory: "3Gi"
      min:
        cpu: "50m"
        memory: "64Mi"
