# Elasticsearch Single-Node — Local K3d Development
# ===================================================
# Deploy Elasticsearch dạng single-node (không cluster) để tiết kiệm RAM
# Mục đích: lưu trữ logs từ Fluent Bit để Gaia Agent query phát hiện anomaly
#
# Lệnh apply:
#   kubectl apply -f elasticsearch.yaml -n monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: monitoring
  labels:
    app: elasticsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
          env:
            # Single-node mode — không cần cluster discovery
            - name: discovery.type
              value: single-node
            # Tắt security (xpack) cho local dev — KHÔNG dùng ở production
            - name: xpack.security.enabled
              value: "false"
            # Giới hạn JVM heap — quan trọng cho local (default 1GB quá nhiều)
            - name: ES_JAVA_OPTS
              value: "-Xms256m -Xmx512m"
          ports:
            - containerPort: 9200
              name: http
            - containerPort: 9300
              name: transport
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
      # initContainer để fix quyền thư mục data cho Elasticsearch
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /usr/share/elasticsearch/data"]
          volumeMounts:
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: es-data
          persistentVolumeClaim:
            claimName: elasticsearch-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: monitoring
  labels:
    app: elasticsearch
spec:
  type: ClusterIP
  ports:
    - port: 9200
      targetPort: 9200
      name: http
  selector:
    app: elasticsearch
