apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: private-ingress
  namespace: zd-sqli-lab
  labels:
    zero-door.io/run: zer41-20261022-9ad4b1e6
spec:
  podSelector:
    matchLabels:
      app: zer41-private-ingress
  policyTypes:
  - Ingress
