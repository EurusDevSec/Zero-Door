  - from:
    - podSelector:
        matchLabels:
          app: zer46-private-ingress
    ports:
    - protocol: TCP
      port: 9140
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
