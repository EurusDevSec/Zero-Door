apiVersion: v1
kind: ConfigMap
metadata:
  name: zer46-private-ingress
  namespace: zd-sqli-lab
  labels:
    zero-door.io/run: zer46-a288c22fc1fb
data:
  dynamic.yaml: "http:\n  routers:\n    fixture:\n      entryPoints:\n      - web\n\
    \      rule: PathPrefix(`/fixture`)\n      service: fixture\n  services:\n   \
    \ fixture:\n      loadBalancer:\n        servers:\n        - url: http://sqli-fixture:9140\n"
---
apiVersion: v1
kind: Service
metadata:
  name: zer46-private-ingress
  namespace: zd-sqli-lab
  labels:
    zero-door.io/run: zer46-a288c22fc1fb
spec:
  type: ClusterIP
  selector:
    app: zer46-private-ingress
  ports:
  - name: web
    port: 8000
    targetPort: web
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: private-ingress
  namespace: zd-sqli-lab
  labels:
    zero-door.io/run: zer46-a288c22fc1fb
spec:
  podSelector:
    matchLabels:
      app: zer46-private-ingress
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: zer46-source
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: sqli-fixture
    ports:
    - protocol: TCP
      port: 9140
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: private-sources
  namespace: zd-sqli-lab
  labels:
    zero-door.io/run: zer46-a288c22fc1fb
spec:
  podSelector:
    matchLabels:
      app: zer46-source
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: zer46-private-ingress
    ports:
    - protocol: TCP
      port: 8000
  - to:
    - podSelector:
        matchLabels:
          app: sqli-fixture
    ports:
    - protocol: TCP
      port: 9140
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
