apiVersion: v1
kind: Namespace
metadata:
  name: zd-sqli-lab
  labels:
    kubernetes.io/metadata.name: zd-sqli-lab
    zero-door.io/purpose: sqli-fixture
    zero-door.io/run: zer42-e0e0aea10613
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sqli-fixture
  namespace: zd-sqli-lab
  labels:
    zero-door.io/run: zer42-e0e0aea10613
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sqli-fixture-config
  namespace: zd-sqli-lab
  labels:
    zero-door.io/run: zer42-e0e0aea10613
data:
  ZD_SQLI_PROFILE: safe
  ZD_SQLI_HOST: 0.0.0.0
  ZD_SQLI_PORT: '9140'
  ZD_SQLI_TRUSTED_PROXIES: ''
  ZD_SQLI_TOPOLOGY: proxied
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqli-fixture
  namespace: zd-sqli-lab
  labels:
    app: sqli-fixture
    zero-door.io/run: zer42-e0e0aea10613
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqli-fixture
  template:
    metadata:
      labels:
        app: sqli-fixture
        zero-door.io/run: zer42-e0e0aea10613
    spec:
      serviceAccountName: sqli-fixture
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: sqli-fixture
        image: zer41-fixture:37c7a045e098
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 9140
        envFrom:
        - configMapRef:
            name: sqli-fixture-config
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 150m
            memory: 96Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
        command:
        - /usr/bin/python3
        - -c
        - 'import os,time; from pathlib import Path; p=Path(''/data/.policy-release'');
          exec("while not p.exists(): time.sleep(0.2)"); os.execv(''/usr/bin/python3'',[''/usr/bin/python3'',''/app/app.py''])'
      volumes:
      - name: data
        emptyDir:
          sizeLimit: 64Mi
      nodeSelector:
        kubernetes.io/hostname: k3d-zero-door-agent-0
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
