apiVersion: v1
kind: ConfigMap
metadata:
  name: zer41-private-ingress
  namespace: zd-sqli-lab
  labels:
    zero-door.io/run: zer42-e0e0aea10613
data:
  dynamic.yaml: "http:\n  routers:\n    fixture:\n      entryPoints:\n      - web\n\
    \      rule: PathPrefix(`/fixture`)\n      service: fixture\n  services:\n   \
    \ fixture:\n      loadBalancer:\n        servers:\n        - url: http://sqli-fixture:9140\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zer41-private-ingress
  namespace: zd-sqli-lab
  labels:
    zero-door.io/run: zer42-e0e0aea10613
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zer41-private-ingress
  template:
    metadata:
      labels:
        app: zer41-private-ingress
        zero-door.io/run: zer42-e0e0aea10613
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: k3d-zero-door-agent-0
      containers:
      - name: traefik
        image: docker.io/library/traefik@sha256:575fa15b135078fe5e50aa847987d96dbddd7b093c172429618404df73f3fa7c
        imagePullPolicy: Never
        args:
        - --global.checkNewVersion=false
        - --global.sendAnonymousUsage=false
        - --entrypoints.web.address=:8000
        - --providers.file.filename=/config/dynamic.yaml
        - --accesslog.fields.headers.defaultmode=drop
        - --accesslog.fields.headers.names.X-Correlation-Id=keep
        - --accesslog.fields.headers.names.X-Request-Id=keep
        - --accesslog=true
        - --accesslog.format=json
        - --log.format=json
        - --log.level=ERROR
        ports:
        - name: web
          containerPort: 8000
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 150m
            memory: 96Mi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: zer41-private-ingress
