apiVersion: v1
kind: ConfigMap
metadata:
  name: zer19-session-source
  namespace: zd-sqli-lab
  labels:
    zero-door.io/run: zer42-e0e0aea10613
data:
  0.py: "\"\"\"Bounded FUNCTIONAL_ONLY Nemesis sessions; never a recovery benchmark\
    \ driver.\n\nOnly registry IDs leave the model. The existing CommandGuard constructs\
    \ targets,\nduration and concurrency; the existing signed worker remains the executor.\n\
    Nothing opens a client, spends tokens or starts a session at import.\n\"\"\"\n\
    import asyncio\nfrom copy import deepcopy\nfrom dataclasses import dataclass\n\
    from datetime import datetime, timezone\nimport hashlib\nimport json\nimport math\n\
    import re\nimport time\nfrom typing import Literal\nimport uuid\n\nfrom pydantic\
    \ import BaseModel, ConfigDict, Field\n\nfrom event_pipeline.contract import new_id\n\
    from event_pipeline.llm import BudgetExceeded\nfrom nemesis.command_guard import\
    \ CommandGuard, Refused, SQLI_TEMPLATE_IDS\n\nPURPOSE = \"FUNCTIONAL_ONLY_NOT_BENCHMARK\"\
    \nPROMPT_VERSION = \"zer19-registry-selector/1\"\nINSTRUCTIONS = \"\"\"Select\
    \ one existing ZERO DOOR local fixture template ID, or STOP.\nUse only the supplied\
    \ health observations and previous execution status. Cite\nexisting evidence IDs.\
    \ Never invent a payload, target, command, intensity or URL.\nSTOP when health\
    \ is unknown or unhealthy, or when another round is unnecessary.\nThis is a separate\
    \ functional session, not a recovery comparison benchmark.\"\"\"\n\n\nclass Plan(BaseModel):\n\
    \    model_config = ConfigDict(extra=\"forbid\", strict=True)\n    template: Literal[\"\
    STOP\", \"disclose-restricted\", \"benign-apparel\", \"benign-home\", \"benign-electronics\"\
    ]\n    evidence_ids: list[str] = Field(min_length=1, max_length=8)\n\n\ndef digest(value):\n\
    \    return hashlib.sha256(json.dumps(value, sort_keys=True, separators=(\",\"\
    , \":\"),\n                                     allow_nan=False).encode()).hexdigest()\n\
    \n\ndef observation_valid(value, *, now=None):\n    \"\"\"A deliberately small\
    \ O projection. No raw result, H oracle or free text.\"\"\"\n    if type(value)\
    \ is not dict or set(value) != {\"observed_at\", \"evidence\"}:\n        raise\
    \ ValueError(\"OBSERVATION_SCHEMA\")\n    try:\n        stamp = datetime.fromisoformat(value[\"\
    observed_at\"].replace(\"Z\", \"+00:00\"))\n        age = ((now or datetime.now(timezone.utc))\
    \ - stamp).total_seconds()\n    except (ValueError, TypeError, AttributeError):\n\
    \        raise ValueError(\"OBSERVATION_TIME\") from None\n    if stamp.tzinfo\
    \ is None or not 0 <= age <= 60:\n        raise ValueError(\"OBSERVATION_STALE\"\
    )\n    evidence = value[\"evidence\"]\n    if type(evidence) is not list or not\
    \ 1 <= len(evidence) <= 8:\n        raise ValueError(\"OBSERVATION_EVIDENCE\"\
    )\n    ids = set()\n    for item in evidence:\n        if (type(item) is not dict\
    \ or set(item) != {\"id\", \"health\"}\n                or type(item[\"id\"])\
    \ is not str or not re.fullmatch(r\"ev-[a-z0-9-]{1,48}\", item[\"id\"])\n    \
    \            or item[\"id\"] in ids or item[\"health\"] not in (\"HEALTHY\", \"\
    UNHEALTHY\", \"UNKNOWN\")):\n            raise ValueError(\"OBSERVATION_EVIDENCE\"\
    )\n        ids.add(item[\"id\"])\n    return deepcopy(value), ids\n\n\n@dataclass(frozen=True)\n\
    class SessionLimits:\n    max_rounds: int = 1\n    duration_s: int = 120\n   \
    \ command_s: int = 1\n    allowed_templates: tuple = tuple(sorted(SQLI_TEMPLATE_IDS))\n\
    \n    def __post_init__(self):\n        for value, high in ((self.max_rounds,\
    \ 3), (self.duration_s, 180), (self.command_s, 5)):\n            if type(value)\
    \ is not int or not 1 <= value <= high:\n                raise ValueError(\"SESSION_LIMITS\"\
    )\n        if (type(self.allowed_templates) is not tuple or not self.allowed_templates\n\
    \                or any(type(x) is not str or x not in SQLI_TEMPLATE_IDS for x\
    \ in self.allowed_templates)\n                or len(set(self.allowed_templates))\
    \ != len(self.allowed_templates)):\n            raise ValueError(\"SESSION_TEMPLATES\"\
    )\n\n\ndef result_valid(raw, command, max_sends):\n    \"\"\"Join the worker receipt,\
    \ without interpreting disclosure as effect/recovery.\"\"\"\n    if (type(raw)\
    \ is not dict or raw.get(\"commandId\") != command[\"commandId\"]\n          \
    \  or raw.get(\"source\") != \"chaos-worker\" or raw.get(\"attackType\") != \"\
    SQLI\"\n            or raw.get(\"status\") not in (\"SUCCESS\", \"FAILED\", \"\
    REJECTED\", \"TIMEOUT\")\n            or type(raw.get(\"duration\")) is not int\
    \ or not 0 <= raw[\"duration\"] <= 60_000):\n        raise ValueError(\"EXECUTOR_RESULT_INVALID\"\
    )\n    if raw[\"status\"] != \"SUCCESS\":\n        return deepcopy(raw)\n    detail\
    \ = raw.get(\"details\")\n    sql = detail.get(\"sqli\") if type(detail) is dict\
    \ else None\n    if (type(sql) is not dict or sql.get(\"templateId\") != command[\"\
    parameters\"][\"customParams\"][\"template\"]\n            or type(sql.get(\"\
    sends\")) is not list or not 1 <= len(sql[\"sends\"]) <= max_sends):\n       \
    \ raise ValueError(\"EXECUTOR_RESULT_INVALID\")\n    for seq, item in enumerate(sql[\"\
    sends\"], 1):\n        if (type(item) is not dict or type(item.get(\"seq\")) is\
    \ not int or item[\"seq\"] != seq\n                or item.get(\"requestId\")\
    \ != command[\"commandId\"] + \"/\" + str(seq)\n                or type(item.get(\"\
    status\")) is not int or item[\"status\"] != 200\n                or type(item.get(\"\
    rows\")) is not int or type(item.get(\"restrictedRows\")) is not int\n       \
    \         or not 0 <= item[\"restrictedRows\"] <= item[\"rows\"]):\n         \
    \   raise ValueError(\"EXECUTOR_RESULT_INVALID\")\n    return deepcopy(raw)\n\n\
    \nclass Session:\n    \"\"\"One owner, one task and one shared RunBudget; no retry/restart\
    \ of sessions.\n\n    stop() cancels observation/inference. Once an external command\
    \ is dispatched,\n    its existing worker deadline bounds it; stop never claims\
    \ remote cancellation.\n    No next command is sent while a previous outcome is\
    \ unknown.\n    \"\"\"\n    def __init__(self, *, purpose, guard, adapter, observe,\
    \ execute, context,\n                 limits=SessionLimits(), sink=None, clock=time.monotonic):\n\
