apiVersion: v1
kind: Namespace
metadata:
  labels:
    zero-door-profile: r1-events
    zero-door-verification: cd87da425168
  name: zd-zer9-cd87da425168
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  name: event-observer
  namespace: zd-zer9-cd87da425168
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: raw-o
  namespace: zd-zer9-cd87da425168
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: raw-h
  namespace: zd-zer9-cd87da425168
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-o
  namespace: zd-zer9-cd87da425168
spec:
  replicas: 1
  selector:
    matchLabels:
      app: events-o
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: events-o
        plane: O
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --plane
        - O
        - --root
        - /raw-o
        - --keys
        - /keys/keys.json
        - --brokers
        - kafka.zero-door.svc.cluster.local:9092
        - --topic
        - zd.events.o.cd87da425168
        env:
        - name: ZD_PROM_QUERIES_FILE
          value: /config/queries.json
        - name: ZD_PROMETHEUS_UPSTREAM
          value: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        - name: ZD_ES_UPSTREAM
          value: http://elasticsearch.monitoring.svc.cluster.local:9200
        image: zero-door/events:zer-9-cd87da425168
        imagePullPolicy: Never
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /livez
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 2
        name: recorder
        ports:
        - containerPort: 8000
        readinessProbe:
          failureThreshold: 60
          httpGet:
            path: /readyz
            port: 8000
          periodSeconds: 2
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 150m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /raw-o
          name: raw
        - mountPath: /keys
          name: keys
          readOnly: true
        - mountPath: /config
          name: config
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: k3d-zero-door-server-0
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      serviceAccountName: event-observer
      volumes:
      - name: raw
        persistentVolumeClaim:
          claimName: raw-o
      - name: keys
        secret:
          secretName: event-o-server
      - configMap:
          name: event-queries
        name: config
---
