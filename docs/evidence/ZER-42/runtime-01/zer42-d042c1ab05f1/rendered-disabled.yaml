    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    env:
    - name: KAFKA_BOOTSTRAP_SERVERS
      value: kafka.zero-door.svc.cluster.local:9092
    - name: KAFKA_COMMANDS_TOPIC
      value: zer42-d042c1ab05f1.commands
    - name: KAFKA_RESULTS_TOPIC
      value: zer42-d042c1ab05f1.results
    - name: KAFKA_GROUP_ID
      value: zer42-d042c1ab05f1.worker
    - name: ZD_COMMAND_POLICY_FILE
      value: /policy/policy.json
    - name: ZD_COMMAND_SIGNER_FILE
      value: /fault/key.json
    - name: ZD_COMMAND_LEDGER_DIR
      value: /ledger
    - name: ZD_SQLI_INGRESS_IP
      value: ''
    volumeMounts:
    - name: policy
      mountPath: /policy
      readOnly: true
    - name: fault
      mountPath: /fault
      readOnly: true
    - name: ledger
      mountPath: /ledger
  volumes:
  - name: policy
    configMap:
      name: zer42-policy
  - name: fault
    secret:
      secretName: zer42-fault
      defaultMode: 288
  - name: ledger
    emptyDir:
      sizeLimit: 16Mi
---
