  name: private-sources
  namespace: zd-sqli-lab
  labels:
    zero-door.io/run: zer46-0123456789ab
spec:
  podSelector:
    matchLabels:
      app: zer46-source
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: zer46-private-ingress
    ports:
    - protocol: TCP
      port: 8000
  - to:
    - podSelector:
        matchLabels:
          app: sqli-fixture
    ports:
    - protocol: TCP
      port: 9140
  - to:
    - namespaceSelector:
        matchLabels:
