apiVersion: v1
kind: Namespace
metadata:
  name: zd-sqli-lab
  labels:
    kubernetes.io/metadata.name: zd-sqli-lab
    zero-door.io/purpose: sqli-fixture
    zero-door.io/run: zer46-0123456789ab
    zero-door.io/containment-scope: zer46-0123456789ab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sqli-fixture
  namespace: zd-sqli-lab
  labels:
    zero-door.io/run: zer46-0123456789ab
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sqli-fixture-config
  namespace: zd-sqli-lab
  labels:
    zero-door.io/run: zer46-0123456789ab
data:
  ZD_SQLI_PROFILE: safe
  ZD_SQLI_HOST: 0.0.0.0
  ZD_SQLI_PORT: '9140'
  ZD_SQLI_TRUSTED_PROXIES: 10.42.1.12/32
  ZD_SQLI_TOPOLOGY: proxied
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqli-fixture
  namespace: zd-sqli-lab
  labels:
    app: sqli-fixture
    zero-door.io/run: zer46-0123456789ab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqli-fixture
  template:
    metadata:
      labels:
        app: sqli-fixture
        zero-door.io/run: zer46-0123456789ab
    spec:
      serviceAccountName: sqli-fixture
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: sqli-fixture
        image: zer46-fixture:24662046a33f
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 9140
        envFrom:
        - configMapRef:
            name: sqli-fixture-config
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 150m
            memory: 96Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 2
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 2
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /data
        - name: containment
          mountPath: /containment
          readOnly: true
        command:
        - /usr/bin/python3
        - -c
        - import time,runpy; from pathlib import Path; end=time.monotonic()+120; exec('while
          not Path("/data/.policy-release").exists():\n assert time.monotonic()<end,
          "POLICY_GATE_TIMEOUT"; time.sleep(0.2)'); runpy.run_path('/app/app.py',run_name='__main__')
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 30
        env:
        - name: ZD_SQLI_CONTAINMENT_FILE
          value: /containment/policy.json
        - name: ZD_SQLI_CONTAINMENT_SCOPE
          value: zer46-0123456789ab
      volumes:
      - name: data
        emptyDir:
          sizeLimit: 64Mi
      - name: containment
        configMap:
          name: zer46-sqli-containment
      nodeSelector:
        kubernetes.io/hostname: k3d-zero-door-server-0
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: sqli-fixture
  namespace: zd-sqli-lab
  labels:
    zero-door.io/run: zer46-0123456789ab
spec:
  type: ClusterIP
  selector:
    app: sqli-fixture
  ports:
  - name: http
    port: 9140
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: zd-sqli-lab
  labels:
    zero-door.io/run: zer46-0123456789ab
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller-and-dns
  namespace: zd-sqli-lab
  labels:
    zero-door.io/run: zer46-0123456789ab
spec:
  podSelector:
    matchLabels:
      app: sqli-fixture
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: zer46-private-ingress
    ports:
    - protocol: TCP
      port: 9140
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zer46-private-ingress
  namespace: zd-sqli-lab
  labels:
    zero-door.io/run: zer46-0123456789ab
data:
  dynamic.yaml: "http:\n  routers:\n    fixture:\n      entryPoints:\n      - web\n\
    \      rule: PathPrefix(`/fixture`)\n      service: fixture\n  services:\n   \
    \ fixture:\n      loadBalancer:\n        servers:\n        - url: http://sqli-fixture:9140\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zer46-private-ingress
  namespace: zd-sqli-lab
  labels:
    zero-door.io/run: zer46-0123456789ab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zer46-private-ingress
  template:
    metadata:
      labels:
        app: zer46-private-ingress
        zero-door.io/run: zer46-0123456789ab
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: k3d-zero-door-server-0
      containers:
      - name: traefik
        image: docker.io/library/traefik@sha256:575fa15b135078fe5e50aa847987d96dbddd7b093c172429618404df73f3fa7c
        imagePullPolicy: IfNotPresent
        args:
        - --global.checkNewVersion=false
        - --global.sendAnonymousUsage=false
        - --entrypoints.web.address=:8000
        - --providers.file.filename=/config/dynamic.yaml
        - --accesslog=true
        - --accesslog.format=json
        - --log.format=json
        - --log.level=ERROR
        ports:
        - name: web
          containerPort: 8000
        readinessProbe:
          tcpSocket:
            port: web
          initialDelaySeconds: 1
          periodSeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 150m
            memory: 96Mi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: zer46-private-ingress
---
apiVersion: v1
kind: Service
metadata:
  name: zer46-private-ingress
  namespace: zd-sqli-lab
  labels:
    zero-door.io/run: zer46-0123456789ab
spec:
  type: ClusterIP
  selector:
    app: zer46-private-ingress
  ports:
  - name: web
    port: 8000
    targetPort: web
---
apiVersion: v1
kind: Pod
metadata:
  name: zer46-source-a
  namespace: zd-sqli-lab
  labels:
    zero-door.io/run: zer46-0123456789ab
    app: zer46-source
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  activeDeadlineSeconds: 900
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  nodeSelector:
    kubernetes.io/hostname: k3d-zero-door-server-0
  containers:
  - name: source
    image: zer46-fixture:24662046a33f
    imagePullPolicy: Never
    command:
    - /usr/bin/python3
    - -c
    - import time; time.sleep(900)
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 48Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: zer46-source-b
  namespace: zd-sqli-lab
  labels:
    zero-door.io/run: zer46-0123456789ab
    app: zer46-source
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  activeDeadlineSeconds: 900
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  nodeSelector:
    kubernetes.io/hostname: k3d-zero-door-server-0
  containers:
  - name: source
    image: zer46-fixture:24662046a33f
    imagePullPolicy: Never
    command:
    - /usr/bin/python3
    - -c
    - import time; time.sleep(900)
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 48Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: private-ingress
  namespace: zd-sqli-lab
  labels:
    zero-door.io/run: zer46-0123456789ab
spec:
  podSelector:
    matchLabels:
      app: zer46-private-ingress
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: zer46-source
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: sqli-fixture
    ports:
    - protocol: TCP
      port: 9140
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
