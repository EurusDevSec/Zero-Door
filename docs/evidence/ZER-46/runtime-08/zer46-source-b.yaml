  activeDeadlineSeconds: 900
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  nodeSelector:
    kubernetes.io/hostname: k3d-zero-door-agent-0
  containers:
